[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-troll"
version = "0.1.0"
description = "Developer-native invention disclosure, prior art search, and patentability risk analysis tooling."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Patent Troll contributors" }]
maintainers = [{ name = "Patent Troll contributors" }]
keywords = ["patents", "prior-art", "software", "invention-disclosure", "openai", "uspto"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.scripts]
patent-troll = "patent_troll.cli:main"

[project.optional-dependencies]
openai = [
  "openai>=3.0.0,<4",
  "pydantic>=2.8.0,<3",
]
anthropic = [
  "anthropic>=1.0.0,<2",
  "pydantic>=2.8.0,<3",
]
llm = [
  "anthropic>=1.0.0,<2",
  "openai>=3.0.0,<4",
  "pydantic>=2.8.0,<3",
]
api = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.32.0",
]
dev = [
  "build>=1.2.0",
  "pydantic>=2.8.0,<3",
  "pytest>=8.0.0",
  "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/varunmurthy23-boop/patent-troll"
Issues = "https://github.com/varunmurthy23-boop/patent-troll/issues"
Source = "https://github.com/varunmurthy23-boop/patent-troll"

[tool.setuptools.packages.find]
include = ["patent_troll*"]
